[project]
name = "rag-lazy-job-apply"
version = "0.1.0"
description = "A RAG-powered terminal copilot that reads your job-application page and tells you what to fill, in your voice."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lazyapply = "lazyapply.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
