<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply — Data Scientist at Acme</title></head>
<body>
  <h1>Apply for this job</h1>
  <form id="app">
    <label for="first_name">First Name *</label>
    <input id="first_name" name="first_name" type="text" required>

    <label for="email">Email *</label>
    <input id="email" name="email" type="email" required>

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel">

    <label for="linkedin">LinkedIn Profile</label>
    <input id="linkedin" name="linkedin" type="url">

    <label for="cover">Why do you want to work here?</label>
    <textarea id="cover" name="cover"></textarea>

    <label for="auth">Are you authorized to work in the country?</label>
    <select id="auth" name="auth">
      <option value="">Select...</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <fieldset>
      <legend>Preferred work mode</legend>
      <label><input type="radio" name="mode" value="remote"> Remote</label>
      <label><input type="radio" name="mode" value="hybrid"> Hybrid</label>
      <label><input type="radio" name="mode" value="onsite"> On-site</label>
    </fieldset>

    <input type="hidden" name="csrf" value="secret">
    <button id="submit-btn" type="submit">Submit Application</button>
  </form>
</body>
</html>
